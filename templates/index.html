<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel Transcriber</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0c0e12;
    --sidebar: #131620;
    --panel: #171a24;
    --panel-2: #1e2230;
    --border: #262b3a;
    --text: #eceef3;
    --muted: #8a90a2;
    --accent: #6c8bff;
    --accent-dim: #6c8bff22;
    --danger: #ff6b6b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8;
      --sidebar: #ffffff;
      --panel: #ffffff;
      --panel-2: #f0f1f5;
      --border: #e2e4ea;
      --text: #16181f;
      --muted: #6b7080;
      --accent: #3f5fe0;
      --accent-dim: #3f5fe015;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 340px;
    min-width: 340px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 1.05rem; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  textarea#links {
    width: 100%;
    min-height: 64px;
    max-height: 160px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    resize: vertical;
    outline: none;
  }
  textarea#links:focus { border-color: var(--accent); }
  .sidebar-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 0.72rem; }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 8px 16px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.9; }
  button.primary:disabled { opacity: 0.4; cursor: default; }

  .history-list { flex: 1; overflow-y: auto; padding: 8px; }
  .history-empty { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 40px 16px; line-height: 1.5; }

  .hist-item {
    display: flex;
    gap: 10px;
    padding: 9px;
    border-radius: 10px;
    cursor: pointer;
    align-items: center;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .hist-item:hover { background: var(--panel-2); }
  .hist-item.active { background: var(--accent-dim); border-color: var(--accent); }
  .hist-thumb {
    width: 46px; height: 46px;
    border-radius: 8px;
    background: var(--panel-2);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 0.65rem;
    position: relative;
    overflow: hidden;
  }
  .hist-thumb .spin {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hist-meta { min-width: 0; flex: 1; }
  .hist-title { font-size: 0.83rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-status { font-size: 0.7rem; color: var(--accent); font-weight: 600; }

  /* ---------- Main ---------- */
  .main { flex: 1; height: 100vh; overflow-y: auto; }
  .main-inner { max-width: 980px; margin: 0 auto; padding: 40px 32px 80px; }

  .empty-state {
    height: 90vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; gap: 8px;
  }
  .empty-state .big { font-size: 2rem; }
  .empty-state h2 { color: var(--text); font-size: 1.1rem; margin: 4px 0 0; }
  .empty-state p { font-size: 0.88rem; max-width: 320px; margin: 0; }

  .detail-grid { display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 800px) { .detail-grid { grid-template-columns: 1fr; } }

  .video-wrap video {
    width: 100%;
    border-radius: var(--radius);
    background: #000;
    display: block;
    max-height: 78vh;
  }
  .status-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    aspect-ratio: 9/16;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    max-height: 78vh;
  }
  .status-panel .spin-lg { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .status-panel .step { color: var(--muted); font-size: 0.85rem; }
  .status-panel .step.active { color: var(--accent); font-weight: 600; }

  .detail-header { margin-bottom: 14px; }
  .uploader { font-weight: 700; font-size: 1rem; }
  .url-line { font-size: 0.75rem; color: var(--muted); word-break: break-all; margin-top: 2px; }
  .url-line a { color: var(--muted); }

  .stats-row { display: flex; gap: 18px; margin: 14px 0; flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--text); }
  .stat .n { font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 0.78rem; }

  .caption-box {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .transcript-box {
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.65;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .error-box { color: var(--danger); background: #ff6b6b15; border: 1px solid #ff6b6b40; border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; }

  .toolbar { display: flex; gap: 8px; margin-top: 14px; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button.ghost:hover { background: var(--panel-2); }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="dot"></span>Reel Transcriber</div>
      <textarea id="links" placeholder="Paste one or more Instagram reel links, one per line"></textarea>
      <div class="sidebar-actions">
        <span class="hint" id="hint">Cached reels load instantly</span>
        <button class="primary" id="submit-btn">Transcribe</button>
      </div>
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty">No reels yet. Paste a link above to get started.</div>
    </div>
  </div>

  <div class="main">
    <div class="main-inner" id="main-inner">
      <div class="empty-state">
        <div class="big">🎬</div>
        <h2>Select a reel</h2>
        <p>Choose one from the sidebar, or paste a link to transcribe a new one.</p>
      </div>
    </div>
  </div>

<script>
const linksEl = document.getElementById('links');
const submitBtn = document.getElementById('submit-btn');
const historyListEl = document.getElementById('history-list');
const mainInner = document.getElementById('main-inner');

let history = [];       // done items, newest first
const jobsById = {};    // id -> latest job (history or in-flight)
let activeId = null;

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return n.toLocaleString();
}

function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function statusStep(job) {
  return { queued: 0, downloading: 1, transcribing: 2, done: 3, error: -1 }[job.status] ?? 0;
}

function renderSidebar() {
  const items = Object.values(jobsById).sort((a, b) => {
    const ta = a.created_at || '9999';
    const tb = b.created_at || '9999';
    if (a.status !== 'done' && b.status === 'done') return -1;
    if (b.status !== 'done' && a.status === 'done') return 1;
    return tb.localeCompare(ta);
  });

  if (items.length === 0) {
    historyListEl.innerHTML = '<div class="history-empty">No reels yet. Paste a link above to get started.</div>';
    return;
  }

  historyListEl.innerHTML = items.map(job => {
    const thumb = job.thumb_file
      ? `style="background-image:url('/media/${job.thumb_file}')"`
      : '';
    const thumbInner = job.thumb_file ? '' : (job.status === 'done' ? '🎬' : (job.status === 'error' ? '⚠' : '<div class="spin"></div>'));
    const title = job.meta?.channel ? '@' + job.meta.channel : (job.meta?.uploader || (job.url ? new URL(job.url).pathname.split('/').filter(Boolean).pop() : job.id));
    const sub = job.status === 'done'
      ? `❤ ${fmtNum(job.meta?.like_count)} · 💬 ${fmtNum(job.meta?.comment_count)} · ${relTime(job.created_at)}`
      : (job.status === 'error' ? 'Failed' : job.status[0].toUpperCase() + job.status.slice(1) + '…');
    return `
      <div class="hist-item ${job.id === activeId ? 'active' : ''}" onclick="selectItem('${job.id}')">
        <div class="hist-thumb" ${thumb}>${thumbInner}</div>
        <div class="hist-meta">
          <div class="hist-title">${title}</div>
          <div class="hist-sub ${job.status !== 'done' && job.status !== 'error' ? 'hist-status' : ''}">${sub}</div>
        </div>
      </div>`;
  }).join('');
}

function renderMain() {
  const job = jobsById[activeId];
  if (!job) {
    mainInner.innerHTML = `
      <div class="empty-state">
        <div class="big">🎬</div>
        <h2>Select a reel</h2>
        <p>Choose one from the sidebar, or paste a link to transcribe a new one.</p>
      </div>`;
    return;
  }

  const leftCol = job.status === 'done' && job.video_file
    ? `<div class="video-wrap"><video controls src="/media/${job.video_file}"></video></div>`
    : job.status === 'error'
      ? `<div class="status-panel"><div>⚠</div><div class="step active">Failed to process</div></div>`
      : `<div class="status-panel">
          <div class="spin-lg"></div>
          <div class="step ${job.status === 'downloading' ? 'active' : ''}">Downloading</div>
          <div class="step ${job.status === 'transcribing' ? 'active' : ''}">Transcribing</div>
        </div>`;

  const m = job.meta;
  const statsHtml = m ? `
    <div class="stats-row">
      <div class="stat">❤ <span class="n">${fmtNum(m.like_count)}</span><span class="l">likes</span></div>
      <div class="stat">💬 <span class="n">${fmtNum(m.comment_count)}</span><span class="l">comments</span></div>
      <div class="stat">▶ <span class="n">${fmtNum(m.view_count)}</span><span class="l">views</span></div>
    </div>
    ${m.description ? `<div class="caption-box">${escapeHtml(m.description)}</div>` : ''}
  ` : '';

  const rightCol = job.status === 'error'
    ? `<div class="error-box">${escapeHtml(job.error || 'Something went wrong.')}</div>`
    : job.status === 'done'
      ? `
        <div class="section-label">Transcript</div>
        <div class="transcript-box">${escapeHtml(job.transcript || '')}</div>
        <div class="toolbar">
          <button class="ghost" onclick="copyTranscript('${job.id}')">Copy transcript</button>
          <button class="ghost" onclick="window.open('${job.url}', '_blank')">Open on Instagram</button>
        </div>`
      : `<div class="section-label">Transcript</div><div class="transcript-box" style="color:var(--muted)">Processing…</div>`;

  mainInner.innerHTML = `
    <div class="detail-grid">
      <div>${leftCol}</div>
      <div>
        <div class="detail-header">
          <div class="uploader">${m?.channel ? '@' + m.channel : (m?.uploader || 'Reel')}</div>
          <div class="url-line"><a href="${job.url}" target="_blank">${job.url}</a></div>
        </div>
        ${statsHtml}
        ${rightCol}
      </div>
    </div>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function copyTranscript(id) {
  const job = jobsById[id];
  if (job?.transcript) navigator.clipboard.writeText(job.transcript);
}

window.selectItem = function (id) {
  activeId = id;
  renderSidebar();
  renderMain();
};

function upsertJob(job) {
  jobsById[job.id] = { ...jobsById[job.id], ...job };
}

async function loadHistory() {
  const res = await fetch('/api/history');
  history = await res.json();
  history.forEach(upsertJob);
  renderSidebar();
  if (!activeId && history.length > 0) {
    activeId = history[0].id;
  }
  renderMain();
}

async function poll(ids) {
  const active = new Set(ids);
  while (active.size > 0) {
    await new Promise(r => setTimeout(r, 1200));
    const res = await fetch('/api/status?ids=' + Array.from(active).join(','));
    const items = await res.json();
    items.forEach(job => {
      upsertJob(job);
      if (job.status === 'done' || job.status === 'error') active.delete(job.id);
    });
    renderSidebar();
    renderMain();
  }
}

submitBtn.addEventListener('click', async () => {
  const urls = linksEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (urls.length === 0) return;
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls })
    });
    const ids = await res.json();
    ids.forEach((id, i) => upsertJob({ id, url: urls[i], status: 'queued' }));
    if (ids.length > 0) activeId = ids[0];
    linksEl.value = '';
    renderSidebar();
    renderMain();
    await poll(ids);
  } finally {
    submitBtn.disabled = false;
  }
});

loadHistory();
</script>
</body>
</html>
